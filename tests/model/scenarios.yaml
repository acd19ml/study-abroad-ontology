# 仅为模型谓词走查的假设输入；不是客户资料或真实学校要求。
cases:
  - name: 未核对中文不能生成最终英文
    rule: rule.ps.confirmed_chinese_before_english
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_1, chinese_confirmed_version: null}
    matched: true
    action: deny
  - name: 对应中文已核对时不命中该禁止条件
    rule: rule.ps.confirmed_chinese_before_english
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_1, chinese_confirmed_version: cn_demo_1}
    matched: false
  - name: 中文新版不能沿用旧版确认
    rule: rule.ps.confirmed_chinese_before_english
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_2, chinese_confirmed_version: cn_demo_1}
    matched: true
    action: deny
  - name: 英文仍基于旧中文时需重新处理
    rule: rule.ps.english_matches_chinese
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_2, chinese_confirmed_version: cn_demo_2, english_based_on_chinese: cn_demo_1}
    matched: true
    action: deny
  - name: 顾问确认不能覆盖未检查的英文新版
    rule: rule.ps.current_version_checked
    facts:
      obj.ps.task: {current_english_version: en_demo_2, checked_english_version: en_demo_1}
    matched: true
    action: deny
  - name: 上下文混入一条其他学生经历即拒绝
    rule: rule.ps.same_student_facts
    facts:
      obj.ps.task: {student_ref: student_demo_a}
      obj.ps.background_fact: [{student_ref: student_demo_a}, {student_ref: student_demo_b}]
    matched: true
    action: deny
  - name: 同一学生的事实可以进入准备范围
    rule: rule.ps.same_student_facts
    facts:
      obj.ps.task: {student_ref: student_demo_a}
      obj.ps.background_fact: [{student_ref: student_demo_a}, {student_ref: student_demo_a}]
    matched: false
  - name: 参考PS也须属于同一学生
    rule: rule.ps.same_student_reference_ps
    facts:
      obj.ps.task: {student_ref: student_demo_a}
      obj.ps.draft: [{student_ref: student_demo_b}]
    matched: true
    action: deny
  - name: 项目相同但申请季不同不能直接套用
    rule: rule.ps.knowledge_scope_matches
    facts:
      obj.ps.task: {program_ref: program_demo, application_season: demo_season_2}
      obj.ps.program_knowledge: {program_ref: program_demo, application_season: demo_season_1}
    matched: true
    action: deny
  - name: 取得的知识尚未入库时不能使用
    rule: rule.ps.knowledge_persisted_before_use
    facts:
      obj.ps.program_knowledge: {persisted: false}
    matched: true
    action: deny
  - name: 无通用初稿仍可直接准备项目稿
    rule: rule.ps.generic_draft_optional
    facts:
      obj.ps.task: {has_generic_draft: false}
    matched: true
    action: allow
  - name: 没找到要求只标记缺口
    rule: rule.ps.unknown_requirement
    facts:
      obj.ps.requirement: [{finding: known}, {finding: not_found}]
    matched: true
    action: flag
  - name: 未找到限制时不能填已知限制值
    rule: rule.ps.unknown_is_not_unrestricted
    facts:
      obj.ps.requirement: [{finding: not_found, value: 500}]
    matched: true
    action: deny
  - name: 未找到限制保留空值不触发伪造限制条件
    rule: rule.ps.unknown_is_not_unrestricted
    facts:
      obj.ps.requirement: [{finding: not_found, value: null}]
    matched: false
  - name: 假设500词限制下501词的稿件不能记为已知要求通过
    rule: rule.ps.ps_length_limit
    facts:
      obj.ps.requirement: [{kind: ps_length, finding: known, value: 500, unit: words}]
      obj.ps.check_report: {known_requirements_passed: true, measured_length: 501, length_unit: words}
    matched: true
    action: deny
  - name: 超长稿件可如实记为未通过
    rule: rule.ps.ps_length_limit
    facts:
      obj.ps.requirement: [{kind: ps_length, finding: known, value: 500, unit: words}]
      obj.ps.check_report: {known_requirements_passed: false, measured_length: 501, length_unit: words}
    matched: false
  - name: 假设500词限制下500词未超限
    rule: rule.ps.ps_length_limit
    facts:
      obj.ps.requirement: [{kind: ps_length, finding: known, value: 500, unit: words}]
      obj.ps.check_report: {known_requirements_passed: true, measured_length: 500, length_unit: words}
    matched: false
  - name: 计量单位不同先交人工核对
    rule: rule.ps.length_measurement_unknown
    facts:
      obj.ps.requirement: [{kind: ps_length, finding: known, value: 500, unit: words}]
      obj.ps.check_report: {measured_length: 450, length_unit: characters}
    matched: true
    action: escalate
  - name: 学生确认不能指向别的中文稿
    rule: rule.ps.confirm_current_chinese
    facts:
      obj.ps.task: {student_ref: student_demo_a, current_chinese_version: cn_demo_2}
      obj.ps.confirmation: {actor_ref: student_demo_a, target_version: cn_demo_1, scope: chinese_content, decision: true}
    matched: true
    action: deny
  # 第 1 项：未确认的录入不能推进确认状态
  - name: 录入的学生回复为未确认时不能推进中文确认
    rule: rule.ps.confirm_current_chinese
    facts:
      obj.ps.task: {student_ref: student_demo_a, current_chinese_version: cn_demo_2}
      obj.ps.confirmation: {actor_ref: student_demo_a, target_version: cn_demo_2, scope: chinese_content, decision: false}
    matched: true
    action: deny
  - name: 学生明确确认当前中文时不命中
    rule: rule.ps.confirm_current_chinese
    facts:
      obj.ps.task: {student_ref: student_demo_a, current_chinese_version: cn_demo_2}
      obj.ps.confirmation: {actor_ref: student_demo_a, target_version: cn_demo_2, scope: chinese_content, decision: true}
    matched: false
  - name: 顾问最终确认记录为未确认时不能完成
    rule: rule.ps.confirm_current_english
    facts:
      obj.ps.task: {current_english_version: en_demo_1}
      obj.ps.confirmation: {target_version: en_demo_1, scope: consultant_final, decision: false}
    matched: true
    action: deny
  # 第 2 项：规则针对明确的记录及量词
  - name: 中文稿引用其他学生经历即拒绝
    rule: rule.ps.draft_facts_same_student
    facts:
      obj.ps.task: {student_ref: student_demo_a}
      obj.ps.background_fact: [{student_ref: student_demo_a}, {student_ref: student_demo_b}]
    matched: true
    action: deny
  - name: 当前英文的检查未通过时不能最终确认
    rule: rule.ps.final_known_requirements
    facts:
      obj.ps.task: {current_english_version: en_demo_2}
      obj.ps.check_report: [{draft_version: en_demo_1, known_requirements_passed: true}, {draft_version: en_demo_2, known_requirements_passed: false}]
    matched: true
    action: deny
  - name: 旧版检查未通过不阻断已通过的当前版本
    rule: rule.ps.final_known_requirements
    facts:
      obj.ps.task: {current_english_version: en_demo_2}
      obj.ps.check_report: [{draft_version: en_demo_1, known_requirements_passed: false}, {draft_version: en_demo_2, known_requirements_passed: true}]
    matched: false
  - name: 中文稿引用未核对经历时标记待核对
    rule: rule.ps.proposed_details_need_verification
    facts:
      obj.ps.background_fact: [{confirmed: true}, {confirmed: false}]
    matched: true
    action: flag
  # 第 3 项：官网要求与网申反馈分别成条
  - name: 官网知识命令写入顾问反馈来源的要求即拒绝
    rule: rule.ps.official_source
    facts:
      obj.ps.requirement: [{source_kind: official_website}, {source_kind: consultant_portal_feedback}]
    matched: true
    action: deny
  - name: 已有顾问网申反馈时仍可写入官网要求
    rule: rule.ps.official_source
    facts:
      obj.ps.program_knowledge: {program_ref: program_demo}
      obj.ps.requirement: [{source_kind: official_website}]
    matched: false
  # 第 4 项：转人工放在 AI 检查上
  - name: 检查发现未知要求时交顾问
    rule: rule.ps.unknown_requirements_human_review
    facts:
      obj.ps.check_report: {has_unknown_requirements: true}
    matched: true
    action: escalate
  # 第 5 项：已审核 PS 只取其他项目的英文定稿
  - name: 中间版本不能作为已审核PS参考
    rule: rule.ps.same_student_reference_ps
    facts:
      obj.ps.task: {student_ref: student_demo_a, program_ref: program_demo_1}
      obj.ps.draft: [{student_ref: student_demo_a, program_ref: program_demo_2, language: en, final_confirmed: false}]
    matched: true
    action: deny
  - name: 本项目自己的稿件不作为已审核PS参考
    rule: rule.ps.same_student_reference_ps
    facts:
      obj.ps.task: {student_ref: student_demo_a, program_ref: program_demo_1}
      obj.ps.draft: [{student_ref: student_demo_a, program_ref: program_demo_1, language: en, final_confirmed: true}]
    matched: true
    action: deny
  - name: 同一学生其他项目的英文定稿可以参考
    rule: rule.ps.same_student_reference_ps
    facts:
      obj.ps.task: {student_ref: student_demo_a, program_ref: program_demo_1}
      obj.ps.draft: [{student_ref: student_demo_a, program_ref: program_demo_2, language: en, final_confirmed: true}]
    matched: false
  # 第 8 项：只有未达标才记录继续申请
  - name: 已达标时不能记录未达标仍继续申请
    rule: rule.ps.continuation_only_when_unmet
    facts:
      obj.ps.task: {eligibility: met}
    matched: true
    action: deny
  - name: 未达标时可以记录继续申请
    rule: rule.ps.continuation_only_when_unmet
    facts:
      obj.ps.task: {eligibility: unmet}
    matched: false
  # 第 9 项：选材理由
  - name: 中文稿缺少选材理由时标记
    rule: rule.ps.explain_selection
    facts:
      obj.ps.selection_rationale: []
    matched: true
    action: flag
  - name: 中文稿有选材理由时不标记
    rule: rule.ps.explain_selection
    facts:
      obj.ps.selection_rationale: [{rationale: demo_reason}]
    matched: false
  - name: 资料缺失时条件结果保持未知
    rule: rule.ps.confirmed_chinese_before_english
    facts: {}
    matched: unknown
