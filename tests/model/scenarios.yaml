# 仅为模型谓词走查的假设输入；不是客户资料或真实学校要求。
cases:
  - name: 未核对中文不能生成最终英文
    rule: rule.ps.confirmed_chinese_before_english
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_1, chinese_confirmed_version: null}
    matched: true
    action: deny
  - name: 对应中文已核对时不命中该禁止条件
    rule: rule.ps.confirmed_chinese_before_english
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_1, chinese_confirmed_version: cn_demo_1}
    matched: false
  - name: 中文新版不能沿用旧版确认
    rule: rule.ps.confirmed_chinese_before_english
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_2, chinese_confirmed_version: cn_demo_1}
    matched: true
    action: deny
  - name: 英文仍基于旧中文时需重新处理
    rule: rule.ps.english_matches_chinese
    facts:
      obj.ps.task: {current_chinese_version: cn_demo_2, chinese_confirmed_version: cn_demo_2, english_based_on_chinese: cn_demo_1}
    matched: true
    action: deny
  - name: 顾问确认不能覆盖未检查的英文新版
    rule: rule.ps.current_version_checked
    facts:
      obj.ps.task: {current_english_version: en_demo_2, checked_english_version: en_demo_1}
    matched: true
    action: deny
  - name: 其他学生的经历不得混入
    rule: rule.ps.same_student_facts
    facts:
      obj.ps.task: {student_ref: student_demo_a}
      obj.ps.background_fact: {student_ref: student_demo_b}
    matched: true
    action: deny
  - name: 同一学生的事实可以进入准备范围
    rule: rule.ps.same_student_facts
    facts:
      obj.ps.task: {student_ref: student_demo_a}
      obj.ps.background_fact: {student_ref: student_demo_a}
    matched: false
  - name: 参考PS也须属于同一学生
    rule: rule.ps.same_student_reference_ps
    facts:
      obj.ps.task: {student_ref: student_demo_a}
      obj.ps.draft: {student_ref: student_demo_b}
    matched: true
    action: deny
  - name: 项目相同但申请季不同不能直接套用
    rule: rule.ps.knowledge_scope_matches
    facts:
      obj.ps.task: {program_ref: program_demo, application_season: demo_season_2}
      obj.ps.program_knowledge: {program_ref: program_demo, application_season: demo_season_1}
    matched: true
    action: deny
  - name: 取得的知识尚未入库时不能使用
    rule: rule.ps.knowledge_persisted_before_use
    facts:
      obj.ps.program_knowledge: {persisted: false}
    matched: true
    action: deny
  - name: 无通用初稿仍可直接准备项目稿
    rule: rule.ps.generic_draft_optional
    facts:
      obj.ps.task: {has_generic_draft: false}
    matched: true
    action: allow
  - name: 没找到要求只标记缺口
    rule: rule.ps.unknown_requirement
    facts:
      obj.ps.requirement: {finding: not_found}
    matched: true
    action: flag
  - name: 未找到限制时不能填已知限制值
    rule: rule.ps.unknown_is_not_unrestricted
    facts:
      obj.ps.requirement: {finding: not_found, value: 500}
    matched: true
    action: deny
  - name: 未找到限制保留空值不触发伪造限制条件
    rule: rule.ps.unknown_is_not_unrestricted
    facts:
      obj.ps.requirement: {finding: not_found, value: null}
    matched: false
  - name: 假设500词限制下501词不合格
    rule: rule.ps.ps_length_limit
    facts:
      obj.ps.requirement: {kind: ps_length, finding: known, value: 500, unit: words}
      obj.ps.check_report: {measured_length: 501, length_unit: words}
    matched: true
    action: deny
  - name: 假设500词限制下500词未超限
    rule: rule.ps.ps_length_limit
    facts:
      obj.ps.requirement: {kind: ps_length, finding: known, value: 500, unit: words}
      obj.ps.check_report: {measured_length: 500, length_unit: words}
    matched: false
  - name: 计量单位不同先交人工核对
    rule: rule.ps.length_measurement_unknown
    facts:
      obj.ps.requirement: {kind: ps_length, finding: known, value: 500, unit: words}
      obj.ps.check_report: {measured_length: 450, length_unit: characters}
    matched: true
    action: escalate
  - name: 学生确认不能指向别的中文稿
    rule: rule.ps.confirm_current_chinese
    facts:
      obj.ps.task: {student_ref: student_demo_a, current_chinese_version: cn_demo_2}
      obj.ps.confirmation: {actor_ref: student_demo_a, target_version: cn_demo_1, scope: chinese_content}
    matched: true
    action: deny
  - name: 资料缺失时条件结果保持未知
    rule: rule.ps.confirmed_chinese_before_english
    facts: {}
    matched: unknown
