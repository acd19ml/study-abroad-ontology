# 模型源；首次结构化表达为待评审草案。原文与理由通过 refs 关联。
model_version: 0.1.0-draft
elements:
- id: cmd.ps.request_ps
  type: command
  name: 发起项目 PS 准备
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  - docs/proposals/ps-model-v0.1.md
  context: ctx.ps.preparation
  basis: agent_proposal
  aggregate: agg.ps.task
  root: obj.ps.task
  role: role.ps.consultant
  params:
  - student_ref
  - program_ref
  - application_season
  allowed_in: []
  transition:
    to: requested
    creates: true
  emits:
  - evt.ps.ps_requested
  execution_level: 仅人工
  effects: []
  preserves: []
- id: evt.ps.ps_requested
  type: event
  name: 发起项目 PS 准备已记录
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  - docs/proposals/ps-model-v0.1.md
  context: ctx.ps.preparation
  basis: agent_proposal
  produced_by: cmd.ps.request_ps
  payload:
  - name: aggregate_ref
    type: identifier
    meaning: 发生该业务事实的聚合标识
    nullable: false
  - name: revision
    type: string
    meaning: 对应版本
    nullable: false
- id: cmd.ps.assemble_context
