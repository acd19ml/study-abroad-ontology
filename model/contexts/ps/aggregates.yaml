  - docs/scenarios/first-scenario/discovery.md
  - docs/proposals/ps-model-v0.1.md
  context: ctx.ps.preparation
  basis: agent_proposal
  produced_by: cmd.ps.request_ps
  payload:
  - name: aggregate_ref
    type: identifier
    meaning: 发生该业务事实的聚合标识
    nullable: false
  - name: revision
    type: string
    meaning: 对应版本
    nullable: false
- id: cmd.ps.assemble_context
