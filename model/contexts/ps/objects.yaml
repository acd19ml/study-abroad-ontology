# 模型源；首次结构化表达为待评审草案。原文与理由通过 refs 关联。
model_version: 0.1.0-draft
elements:
- id: obj.ps.task
  type: object
  name: 项目 PS 准备任务
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.task
  attributes:
  - name: student_ref
    type: identifier
    meaning: 学生上下文读视图标识
    nullable: false
  - name: program_ref
    type: identifier
    meaning: 目标项目知识标识
    nullable: false
  - name: application_season
    type: string
    meaning: 本任务所用申请季
    nullable: false
  - name: direction
    type: string
    meaning: 项目对应的申请方向，可未知
    nullable: true
  - name: current_chinese_version
    type: identifier
    meaning: 当前中文版本
    nullable: true
  - name: chinese_confirmed_version
    type: identifier
    meaning: 学生已确认的中文版本
    nullable: true
  - name: current_english_version
    type: identifier
    meaning: 当前英文版本
    nullable: true
  - name: english_based_on_chinese
    type: identifier
    meaning: 当前英文依据的中文版本
    nullable: true
  - name: checked_english_version
    type: identifier
    meaning: 本次检查覆盖的英文版本
    nullable: true
  - name: final_english_version
    type: identifier
    meaning: 顾问最终确认的英文版本
    nullable: true
  - name: has_generic_draft
    type: boolean
    meaning: 是否存在可参考方向初稿；不是起草前置条件
    nullable: false
  - name: eligibility
    type: enum
    meaning: 官网最低申请条件对照事实，未知保持未知
    nullable: false
    values:
    - unknown
    - met
    - unmet
  - name: continuation_decision
    type: enum
    meaning: 顾问与客户的申请选择，与达标事实分开
    nullable: false
    values:
    - undecided
    - continue
    - withdraw
  lifecycle:
    initial: requested
    states:
    - requested
    - context_ready
    - chinese_prepared
    - chinese_confirmed
    - english_prepared
    - checked
    - consultant_confirmed
    transitions:
    - from: null
      to: requested
      by: cmd.ps.request_ps
    - from: requested
      to: context_ready
      by: cmd.ps.assemble_context
    - from: context_ready
      to: context_ready
      by: cmd.ps.assemble_context
    - from: context_ready
      to: chinese_prepared
      by: cmd.ps.prepare_chinese
    - from: chinese_prepared
      to: chinese_prepared
      by: cmd.ps.prepare_chinese
    - from: chinese_prepared
      to: chinese_confirmed
      by: cmd.ps.confirm_chinese
    - from: chinese_confirmed
      to: english_prepared
      by: cmd.ps.generate_english
    - from: english_prepared
      to: checked
      by: cmd.ps.check_english
    - from: checked
      to: checked
      by: cmd.ps.check_english
    - from: checked
      to: consultant_confirmed
      by: cmd.ps.confirm_final
    - from: chinese_prepared
      to: chinese_prepared
      by: cmd.ps.revise_chinese
    - from: chinese_confirmed
      to: chinese_prepared
      by: cmd.ps.revise_chinese
    - from: english_prepared
      to: chinese_prepared
      by: cmd.ps.revise_chinese
    - from: checked
      to: chinese_prepared
      by: cmd.ps.revise_chinese
    - from: consultant_confirmed
      to: chinese_prepared
      by: cmd.ps.revise_chinese
    - from: requested
      to: requested
      by: cmd.ps.record_issue
    - from: context_ready
      to: context_ready
      by: cmd.ps.record_issue
    - from: chinese_prepared
      to: chinese_prepared
      by: cmd.ps.record_issue
    - from: chinese_confirmed
      to: chinese_confirmed
      by: cmd.ps.record_issue
    - from: english_prepared
      to: english_prepared
      by: cmd.ps.record_issue
    - from: checked
      to: checked
      by: cmd.ps.record_issue
    - from: consultant_confirmed
      to: consultant_confirmed
      by: cmd.ps.record_issue
    - from: requested
      to: requested
      by: cmd.ps.resolve_issue
    - from: context_ready
      to: context_ready
      by: cmd.ps.resolve_issue
    - from: chinese_prepared
      to: chinese_prepared
      by: cmd.ps.resolve_issue
    - from: chinese_confirmed
      to: chinese_confirmed
      by: cmd.ps.resolve_issue
    - from: english_prepared
      to: english_prepared
      by: cmd.ps.resolve_issue
    - from: checked
      to: checked
      by: cmd.ps.resolve_issue
    - from: consultant_confirmed
      to: consultant_confirmed
      by: cmd.ps.resolve_issue
    - from: requested
      to: requested
      by: cmd.ps.record_continuation
    - from: context_ready
      to: context_ready
      by: cmd.ps.record_continuation
    - from: chinese_prepared
      to: chinese_prepared
      by: cmd.ps.record_continuation
    - from: chinese_confirmed
      to: chinese_confirmed
      by: cmd.ps.record_continuation
    - from: english_prepared
      to: english_prepared
      by: cmd.ps.record_continuation
    - from: checked
      to: checked
      by: cmd.ps.record_continuation
    - from: consultant_confirmed
      to: consultant_confirmed
      by: cmd.ps.record_continuation
    labels:
    - value: requested
      name: 已发起
    - value: context_ready
      name: 上下文已准备
    - value: chinese_prepared
      name: 中文待核对
    - value: chinese_confirmed
      name: 中文已确认
    - value: english_prepared
      name: 英文已生成
    - value: checked
      name: 英文已检查
    - value: consultant_confirmed
      name: 顾问已确认
- id: obj.ps.draft
  type: object
  name: PS 稿件版本
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.task
  attributes:
  - name: version_id
    type: identifier
    meaning: 稿件版本标识
    nullable: false
  - name: student_ref
    type: identifier
    meaning: 稿件属于的学生
    nullable: false
  - name: program_ref
    type: identifier
    meaning: 项目稿对应的项目；通用稿可空
    nullable: true
  - name: purpose
    type: enum
    meaning: 稿件用途
    nullable: false
    values:
    - direction_generic
    - project
  - name: language
    type: enum
    meaning: 稿件语言
    nullable: false
    values:
    - zh
    - en
  - name: content_ref
    type: uri
    meaning: 稿件正文位置
    nullable: false
  - name: fact_refs
    type: identifier_list
    meaning: 引用的经历事实
    nullable: false
  - name: based_on_version
    type: identifier
    meaning: 对应中文或前版标识
    nullable: true
  lifecycle: null
- id: obj.ps.confirmation
  type: object
  name: 内容确认记录
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.task
  attributes:
  - name: target_version
    type: identifier
    meaning: 本次实际确认的稿件版本
    nullable: false
  - name: scope
    type: enum
    meaning: 确认范围
    nullable: false
    values:
    - chinese_content
    - consultant_final
  - name: actor_ref
    type: identifier
    meaning: 作出确认的学生或顾问
    nullable: false
  - name: decision
    type: boolean
    meaning: 明确确认或未确认
    nullable: false
  - name: evidence_ref
    type: uri
    meaning: 微信等确认依据位置
    nullable: false
  lifecycle: null
- id: obj.ps.context_packet
  type: object
  name: 任务上下文与依据
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.task
  attributes:
  - name: student_ref
    type: identifier
    meaning: 本任务学生
    nullable: false
  - name: program_ref
    type: identifier
    meaning: 本任务项目
    nullable: false
  - name: student_revision
    type: string
    meaning: 所用学生上下文版本
    nullable: false
  - name: knowledge_revision
    type: string
    meaning: 所用项目知识版本
    nullable: false
  - name: fact_refs
    type: identifier_list
    meaning: 相关事实
    nullable: false
  - name: material_refs
    type: identifier_list
    meaning: 相关背景材料
    nullable: false
  - name: approved_ps_refs
    type: identifier_list
    meaning: 同一学生其他项目已审核 PS 的引用
    nullable: false
  - name: generic_draft_refs
    type: identifier_list
    meaning: 已有方向初稿引用，可为空
    nullable: false
  - name: requirement_refs
    type: identifier_list
    meaning: 已入库项目要求引用
    nullable: false
  - name: course_refs
    type: identifier_list
    meaning: 已入库课程引用
    nullable: false
  - name: rule_refs
    type: identifier_list
    meaning: 本任务采用的模型规则
    nullable: false
  - name: manual_context_categories
    type: string_list
    meaning: 仍要求顾问手动补齐的可取得信息类别，仅供待确认指标使用
    nullable: false
  lifecycle: null
- id: obj.ps.check_report
  type: object
  name: 稿件检查结果
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.task
  attributes:
  - name: draft_version
    type: identifier
    meaning: 本报告检查的英文版本
    nullable: false
  - name: chinese_version
    type: identifier
    meaning: 核对的中文版本
    nullable: false
  - name: knowledge_revision
    type: string
    meaning: 所用要求版本
    nullable: false
  - name: known_requirements_passed
    type: boolean
    meaning: 已知要求的检查是否通过
    nullable: false
  - name: has_unknown_requirements
    type: boolean
    meaning: 是否仍有未知要求，不能改记为无限制
    nullable: false
  - name: measured_length
    type: number
    meaning: 按官网计量单位得到的稿件长度，可未知
    nullable: true
  - name: length_unit
    type: string
    meaning: 本次长度测量单位，可未知
    nullable: true
  - name: source_refs
    type: string_list
    meaning: 关键要求及背景依据
    nullable: false
  - name: issue_refs
    type: identifier_list
    meaning: 具体待决问题
    nullable: false
  lifecycle: null
- id: obj.ps.issue
  type: object
  name: 具体核对问题
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.task
  attributes:
  - name: kind
    type: enum
    meaning: 缺口或差异种类
    nullable: false
    values:
    - missing_requirement
    - conflicting_background
    - unverified_detail
    - scope_decision
  - name: original_refs
    type: string_list
    meaning: 原话或原资料位置
    nullable: false
  - name: question
    type: string
    meaning: 需人工判断的具体问题
    nullable: false
  - name: affected_refs
    type: identifier_list
    meaning: 受影响内容
    nullable: false
  - name: resolution
    type: string
    meaning: 人工处理意见；未解决为空
    nullable: true
  lifecycle: null
- id: obj.ps.continuation_decision
  type: object
  name: 未达标项目人工选择
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.task
  attributes:
  - name: reason
    type: string
    meaning: 未达标原因
    nullable: false
  - name: choice
    type: enum
    meaning: 最终申请选择
    nullable: false
    values:
    - continue
    - withdraw
  - name: customer_evidence_ref
    type: uri
    meaning: 客户明确选择的沟通记录
    nullable: false
  - name: consultant_ref
    type: identifier
    meaning: 记录与协商的顾问
    nullable: false
  lifecycle: null
- id: obj.ps.student_context
  type: object
  name: 学生上下文读视图
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.student_context
  attributes:
  - name: student_ref
    type: identifier
    meaning: 原业务学生标识
    nullable: false
  - name: revision
    type: string
    meaning: 读取的背景版本
    nullable: false
  - name: source_refs
    type: string_list
    meaning: 原材料及微信沟通位置
    nullable: false
  lifecycle:
    initial: recorded
    states:
    - recorded
    transitions:
    - from: null
      to: recorded
      by: cmd.ps.record_student_context
    - from: recorded
      to: recorded
      by: cmd.ps.refresh_student_context
    labels:
    - value: recorded
      name: 已记录
- id: obj.ps.applicant
  type: object
  name: 申请人背景
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.student_context
  attributes:
  - name: student_ref
    type: identifier
    meaning: 学生标识
    nullable: false
  - name: study_status
    type: enum
    meaning: 实际学业状态
    nullable: false
    values:
    - enrolled
    - graduated
    - unknown
  - name: university
    type: string
    meaning: 本科院校，可未知
    nullable: true
  - name: major
    type: string
    meaning: 本科专业，可未知
    nullable: true
  - name: grades
    type: string
    meaning: 成绩及其口径，可未知
    nullable: true
  - name: internships
    type: string
    meaning: 实习经历概况，可未知
    nullable: true
  - name: target_regions
    type: string_list
    meaning: 目标地区
    nullable: false
  - name: entry_time
    type: string
    meaning: 入学时间，可未知
    nullable: true
  - name: interests
    type: string_list
    meaning: 感兴趣方向
    nullable: false
  lifecycle: null
- id: obj.ps.background_fact
  type: object
  name: 背景经历事实
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.student_context
  attributes:
  - name: student_ref
    type: identifier
    meaning: 事实归属学生
    nullable: false
  - name: content
    type: string
    meaning: 经历或背景陈述
    nullable: false
  - name: origin
    type: enum
    meaning: 内容来源类别
    nullable: false
    values:
    - student_statement
    - student_material
    - consultant_proposal
  - name: confirmed
    type: boolean
    meaning: 是否已由学生核对
    nullable: false
  - name: verification_ref
    type: uri
    meaning: 核对依据，未核对可空
    nullable: true
  - name: source_refs
    type: string_list
    meaning: 原话、素材或依据位置
    nullable: false
  lifecycle: null
- id: obj.ps.background_material
  type: object
  name: 背景材料
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.student_context
  attributes:
  - name: student_ref
    type: identifier
    meaning: 材料归属学生
    nullable: false
  - name: kind
    type: string
    meaning: 课程作业、论文、证明或参考稿等材料类别
    nullable: false
  - name: location
    type: uri
    meaning: 材料所在位置
    nullable: false
  - name: related_fact_refs
    type: identifier_list
    meaning: 可支持或说明的经历
    nullable: false
  lifecycle: null
- id: obj.ps.program_knowledge
  type: object
  name: 项目知识记录
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.program_knowledge
  attributes:
  - name: program_ref
    type: identifier
    meaning: 具体学校项目标识
    nullable: false
  - name: application_season
    type: string
    meaning: 适用申请季
    nullable: false
  - name: revision
    type: string
    meaning: 知识记录版本
    nullable: false
  - name: persisted
    type: boolean
    meaning: 本版是否已结构化入库
    nullable: false
  - name: source_kind
    type: enum
    meaning: 本次来源类别
    nullable: false
    values:
    - official_website
    - consultant_portal_feedback
  - name: source_refs
    type: string_list
    meaning: 官网或顾问反馈出处
    nullable: false
  lifecycle:
    initial: recorded
    states:
    - recorded
    transitions:
    - from: null
      to: recorded
      by: cmd.ps.record_official_knowledge
    - from: recorded
      to: recorded
      by: cmd.ps.refresh_official_knowledge
    - from: recorded
      to: recorded
      by: cmd.ps.record_portal_feedback
    labels:
    - value: recorded
      name: 已记录
- id: obj.ps.program
  type: object
  name: 目标项目资料
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.program_knowledge
  attributes:
  - name: program_ref
    type: identifier
    meaning: 具体硕士项目
    nullable: false
  - name: school_name
    type: string
    meaning: 学校名称
    nullable: false
  - name: program_name
    type: string
    meaning: 项目名称
    nullable: false
  - name: official_url
    type: uri
    meaning: 学校官方页面
    nullable: false
  lifecycle: null
- id: obj.ps.course
  type: object
  name: 项目课程资料
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.program_knowledge
  attributes:
  - name: program_ref
    type: identifier
    meaning: 所属项目
    nullable: false
  - name: name
    type: string
    meaning: 课程名称
    nullable: false
  - name: description
    type: string
    meaning: 有来源的课程与培养内容
    nullable: false
  - name: source_ref
    type: uri
    meaning: 官网出处
    nullable: false
  lifecycle: null
- id: obj.ps.requirement
  type: object
  name: 项目要求记录
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  aggregate: agg.ps.program_knowledge
  attributes:
  - name: program_ref
    type: identifier
    meaning: 要求适用项目
    nullable: false
  - name: application_season
    type: string
    meaning: 适用申请季
    nullable: false
  - name: kind
    type: enum
    meaning: 要求类别
    nullable: false
    values:
    - ps_prompt
    - ps_length
    - ps_format
    - minimum_eligibility
    - deadline
  - name: finding
    type: enum
    meaning: 查证所得情况，与业务流程状态区分
    nullable: false
    values:
    - known
    - not_found
    - explicitly_unrestricted
  - name: value
    type: scalar
    meaning: 已查明的要求值；未知或明确无限制时可空
    nullable: true
  - name: unit
    type: string
    meaning: 计量单位或口径，按官网实际记录
    nullable: true
  - name: source_ref
    type: uri
    meaning: 要求原文出处，没找到时记录查找说明位置
    nullable: false
  lifecycle: null
- id: rel.ps.task_drafts
  type: relation
  name: 任务包含稿件版本
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  to: obj.ps.draft
  kind: composition
  cardinality: 0..*
  semantic: task_drafts
  from: obj.ps.task
- id: rel.ps.task_confirmations
  type: relation
  name: 任务包含内容确认
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
  context: ctx.ps.preparation
  basis: confirmed_business
  to: obj.ps.confirmation
  kind: composition
  cardinality: 0..*
  semantic: task_confirmations
  from: obj.ps.task
- id: rel.ps.task_packet
  type: relation
  name: 任务包含上下文依据
  status: draft
  owner: role.ps.consultant
  since: 0.1.0-draft
  refs:
  - docs/scenarios/first-scenario/discovery.md
